<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Tatuaje</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0}</style></head>
<body>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <!-- Ancho 1 = ancho del tatuaje. Para ponerlo ARRIBA: position="0 1.1 0.05" -->
    <a-plane id="contenido" position="0 0 0.05" width="1" height="1" visible="false"
      animation="property: scale; from: 0.95 0.95 0.95; to: 1.05 1.05 1.05; dir: alternate; dur: 1200; loop: true"></a-plane>
  </a-entity>
</a-scene>
<script>
// Carga overlay.png siempre fresco (sin caché) y ajusta la proporción sola.
const plane = document.getElementById('contenido');
const img = new Image();
img.onload = () => {
  plane.setAttribute('height', (img.naturalHeight / img.naturalWidth).toFixed(3));
  plane.setAttribute('src', img.src);
  plane.setAttribute('visible', 'true');
};
img.src = 'overlay.png?t=' + Date.now();
</script>
</body></html>
