<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Tatuaje</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0}</style></head>
<body>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets><img id="contenido" src="overlay.png"></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <!-- El plano mide 1 = ancho del marcador. Para ponerlo ARRIBA del tatuaje cambiá position a "0 1.1 0.05" -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane src="#contenido" position="0 0 0.05" width="1" height="1">
      <a-animation attribute="scale" dur="1200" from="0.9 0.9 0.9" to="1.05 1.05 1.05" direction="alternate" repeat="indefinite"></a-animation>
    </a-plane>
  </a-entity>
</a-scene>
</body></html>
