<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Tatuaje</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0}</style></head>
<body>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; missTolerance: 10;" color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"
    cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<script>
/* ============ EDITÁ SOLO ESTA PARTE ============ */
const PERFIL = {
  foto:   "foto.png",
  nombre: "Sebastián Martínez",
  rol:    "Diseñador gráfico · Programador",
  datos: [                                  // [ETIQUETA, valor] – hasta 4 filas
    ["TÍTULO",  "Técnico en Ciencia de Datos e IA"],
    ["ÁREAS",   "Fotografía · Diseño web · Docencia"],
    ["EDAD",    "47"]
  ],
  redes: [                                  // hasta 4 botones
    { n: "CV",        u: "https://PEGAR_LINK_DEL_CV" },
    { n: "Instagram", u: "https://instagram.com/TU_USUARIO" },
    { n: "Facebook",  u: "https://facebook.com/TU_USUARIO" },
    { n: "GitHub",    u: "https://github.com/sebamartinezdg" }
  ]
};
const TARJETA_Y = 1.45;   // altura de la tarjeta sobre el tatuaje (1 = ancho del tatuaje). Subila o bajala.
const ESCALA    = 1;      // tamaño general de toda la interfaz
/* ================================================= */

const THREE = AFRAME.THREE;
const CW = 1024, CH = 750, U = 1.5 / CW;   // tarjeta: 1.5 unidades de ancho
const CYAN = '0,229,255';

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function planoCanvas(parent, o) {
  const canvas = document.createElement('canvas'); canvas.width = o.cw; canvas.height = o.ch;
  const el = document.createElement('a-plane');
  el.setAttribute('width', o.w); el.setAttribute('height', o.h); el.setAttribute('position', o.pos);
  el.setAttribute('material', 'shader: flat; transparent: true; side: double; depthWrite: false');
  if (o.clase) el.classList.add(o.clase);
  const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace;
  el.addEventListener('loaded', () => {
    const m = el.getObject3D('mesh'); m.material.map = tex; m.material.needsUpdate = true;
  });
  parent.appendChild(el);
  return { el, canvas, ctx: canvas.getContext('2d'), tex };
}
function ajustar(c, txt, maxW, size, peso) {
  let s = size;
  do { c.font = peso + ' ' + s + "px 'Segoe UI', system-ui, sans-serif"; s -= 2; }
  while (c.measureText(txt).width > maxW && s > 12);
}
function espaciado(c, px) { if ('letterSpacing' in c) c.letterSpacing = px + 'px'; }

const target = document.getElementById('target');
const grupo = document.createElement('a-entity');
grupo.setAttribute('scale', '0.01 0.01 0.01');
grupo.setAttribute('animation__in', 'property: scale; from: 0.01 0.01 0.01; to: ' + ESCALA + ' ' + ESCALA + ' ' + ESCALA +
  '; dur: 800; easing: easeOutBack; startEvents: aparecer');
target.appendChild(grupo);

/* --- Anillos alrededor del tatuaje --- */
function anillo(r, dash, ancho, alfa, giro, dur) {
  const p = planoCanvas(grupo, { w: 1.5, h: 1.5, cw: 512, ch: 512, pos: '0 0 0.02' });
  const c = p.ctx; c.strokeStyle = 'rgba(' + CYAN + ',' + alfa + ')'; c.lineWidth = ancho;
  c.shadowColor = '#00e5ff'; c.shadowBlur = 12; c.setLineDash(dash);
  c.beginPath(); c.arc(256, 256, r, 0, Math.PI * 2); c.stroke();
  p.el.setAttribute('animation__rot', 'property: rotation; to: 0 0 ' + giro + '; dur: ' + dur + '; loop: true; easing: linear');
  return p;
}
anillo(238, [22, 14], 5, 0.95, 360, 14000);
anillo(212, [80, 50], 3, 0.6, -360, 9000);
const pulso = planoCanvas(grupo, { w: 1.5, h: 1.5, cw: 512, ch: 512, pos: '0 0 0.015' });
pulso.ctx.strokeStyle = 'rgba(' + CYAN + ',0.35)'; pulso.ctx.lineWidth = 2;
pulso.ctx.beginPath(); pulso.ctx.arc(256, 256, 250, 0, Math.PI * 2); pulso.ctx.stroke();
pulso.el.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.06 1.06 1.06; dir: alternate; dur: 1100; loop: true; easing: easeInOutSine');

/* --- Línea que une el tatuaje con la tarjeta --- */
const yBase = 0.72, yTarj = TARJETA_Y - 0.55;
const lin = document.createElement('a-plane');
lin.setAttribute('width', 0.012); lin.setAttribute('height', Math.max(yTarj - yBase, 0.02));
lin.setAttribute('position', '0 ' + ((yBase + yTarj) / 2) + ' 0.04');
lin.setAttribute('material', 'shader: flat; color: #00e5ff; opacity: 0.85; transparent: true');
grupo.appendChild(lin);

/* --- Tarjeta --- */
const card = planoCanvas(grupo, { w: 1.5, h: CH * U, cw: CW, ch: CH, pos: '0 ' + TARJETA_Y + ' 0.05' });
const foto = new Image(); let fotoOK = false;
foto.onload = () => { fotoOK = true; }; foto.src = PERFIL.foto;

function esquina(c, x, y, dx, dy) {
  c.beginPath(); c.moveTo(x, y + dy * 46); c.lineTo(x, y); c.lineTo(x + dx * 46, y); c.stroke();
}
function dibujarCard(t) {
  const c = card.ctx; c.clearRect(0, 0, CW, CH);
  c.save(); rr(c, 8, 8, CW - 16, CH - 16, 26);
  const g = c.createLinearGradient(0, 0, CW * 0.4, CH);
  g.addColorStop(0, 'rgba(0,34,52,0.88)'); g.addColorStop(1, 'rgba(0,10,20,0.92)');
  c.fillStyle = g; c.fill();
  c.shadowColor = '#00e5ff'; c.shadowBlur = 22; c.lineWidth = 3; c.strokeStyle = 'rgba(' + CYAN + ',0.8)'; c.stroke();
  c.restore();

  c.save(); rr(c, 8, 8, CW - 16, CH - 16, 26); c.clip();
  c.strokeStyle = 'rgba(' + CYAN + ',0.05)'; c.lineWidth = 1;
  for (let y = 20; y < CH; y += 26) { c.beginPath(); c.moveTo(0, y); c.lineTo(CW, y); c.stroke(); }
  const sy = ((t * 0.22) % 1) * CH;
  const sg = c.createLinearGradient(0, 0, CW, 0);
  sg.addColorStop(0, 'rgba(' + CYAN + ',0)'); sg.addColorStop(0.5, 'rgba(' + CYAN + ',0.9)'); sg.addColorStop(1, 'rgba(' + CYAN + ',0)');
  c.fillStyle = sg; c.fillRect(0, sy, CW, 3);
  const sg2 = c.createLinearGradient(0, sy - 60, 0, sy);
  sg2.addColorStop(0, 'rgba(' + CYAN + ',0)'); sg2.addColorStop(1, 'rgba(' + CYAN + ',0.10)');
  c.fillStyle = sg2; c.fillRect(0, sy - 60, CW, 60);
  c.restore();

  c.strokeStyle = '#00e5ff'; c.lineWidth = 5;
  esquina(c, 22, 22, 1, 1); esquina(c, CW - 22, 22, -1, 1); esquina(c, 22, CH - 22, 1, -1); esquina(c, CW - 22, CH - 22, -1, -1);

  c.fillStyle = 'rgba(61,255,154,' + (0.55 + 0.45 * Math.sin(t * 4)) + ')';
  c.beginPath(); c.arc(56, 62, 8, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(' + CYAN + ',0.9)'; c.font = "600 20px 'Segoe UI', system-ui, sans-serif"; espaciado(c, 3);
  c.textAlign = 'left'; c.fillText('ESCANEO COMPLETO · PERFIL ENCONTRADO', 76, 69); espaciado(c, 0);

  const px = 170, py = 250;
  c.save(); c.beginPath(); c.arc(px, py, 98, 0, Math.PI * 2); c.fillStyle = 'rgba(0,45,66,0.9)'; c.fill(); c.clip();
  if (fotoOK) c.drawImage(foto, px - 98, py - 98, 196, 196);
  c.restore();
  c.lineWidth = 4; c.strokeStyle = '#00e5ff'; c.beginPath(); c.arc(px, py, 100, 0, Math.PI * 2); c.stroke();
  c.save(); c.translate(px, py); c.rotate(t * 0.8); c.setLineDash([16, 12]); c.lineWidth = 3;
  c.strokeStyle = 'rgba(' + CYAN + ',0.9)'; c.beginPath(); c.arc(0, 0, 122, 0, Math.PI * 2); c.stroke(); c.restore();
  c.save(); c.translate(px, py); c.rotate(-t * 1.3); c.setLineDash([60, 40]); c.lineWidth = 3;
  c.strokeStyle = 'rgba(' + CYAN + ',0.5)'; c.beginPath(); c.arc(0, 0, 138, 0, Math.PI * 2); c.stroke(); c.restore();

  c.textAlign = 'left'; c.fillStyle = '#e8fdff'; c.shadowColor = '#00e5ff'; c.shadowBlur = 14;
  ajustar(c, PERFIL.nombre, 640, 48, 700); c.fillText(PERFIL.nombre, 330, 235);
  c.shadowBlur = 0; c.fillStyle = 'rgba(125,239,255,1)'; espaciado(c, 2);
  const rol = PERFIL.rol.toUpperCase(); ajustar(c, rol, 640, 25, 500); c.fillText(rol, 332, 282); espaciado(c, 0);

  const y0 = 372;
  PERFIL.datos.slice(0, 4).forEach(([k, v], i) => {
    const y = y0 + i * 50;
    c.strokeStyle = 'rgba(' + CYAN + ',0.22)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(48, y - 30); c.lineTo(CW - 48, y - 30); c.stroke();
    c.textAlign = 'left'; c.fillStyle = 'rgba(' + CYAN + ',0.85)'; c.font = "600 19px 'Segoe UI', system-ui, sans-serif"; espaciado(c, 3);
    c.fillText(k, 48, y); espaciado(c, 0);
    c.textAlign = 'right'; c.fillStyle = '#e8fdff'; ajustar(c, v, 620, 27, 400); c.fillText(v, CW - 48, y);
  });
  card.tex.needsUpdate = true;
}

/* --- Botones (tocables) --- */
function dibujarBoton(b, label, presionado) {
  const c = b.ctx, w = b.canvas.width, h = b.canvas.height;
  c.clearRect(0, 0, w, h); rr(c, 4, 4, w - 8, h - 8, h * 0.2);
  c.fillStyle = presionado ? 'rgba(' + CYAN + ',0.55)' : 'rgba(' + CYAN + ',0.14)'; c.fill();
  c.shadowColor = '#00e5ff'; c.shadowBlur = presionado ? 20 : 8; c.lineWidth = 3; c.strokeStyle = 'rgba(' + CYAN + ',0.9)'; c.stroke();
  c.shadowBlur = 0; c.fillStyle = '#e8fdff'; c.textAlign = 'center'; c.textBaseline = 'middle'; espaciado(c, 2);
  ajustar(c, label.toUpperCase(), w - 24, h * 0.36, 600); c.fillText(label.toUpperCase(), w / 2, h / 2 + 2);
  espaciado(c, 0); c.textBaseline = 'alphabetic'; b.tex.needsUpdate = true;
}
const redes = PERFIL.redes.slice(0, 4), n = redes.length;
const bw = (900 - (n - 1) * 20) / n, bh = 80;
redes.forEach((r, i) => {
  const cx = 62 + bw / 2 + i * (bw + 20);
  const b = planoCanvas(grupo, {
    w: bw * U, h: bh * U, cw: Math.round(bw * 1.5), ch: Math.round(bh * 1.5), clase: 'clickable',
    pos: ((cx - CW / 2) * U) + ' ' + (TARJETA_Y + (CH / 2 - 640) * U) + ' 0.07'
  });
  dibujarBoton(b, r.n, false);
  b.el.addEventListener('click', () => {
    dibujarBoton(b, r.n, true); setTimeout(() => dibujarBoton(b, r.n, false), 250);
    window.open(r.u, '_blank');
  });
});

/* --- Animación y aparición --- */
dibujarCard(0);
setInterval(() => { if (target.object3D.visible) dibujarCard(performance.now() / 1000); }, 60);
target.addEventListener('targetFound', () => grupo.emit('aparecer'));
</script>
</body></html>
