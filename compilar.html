<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compilar marcador</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<style>body{font-family:sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}</style></head>
<body>
<h2>Compilar marcador → targets.mind</h2>
<p>Elegí la imagen del tatuaje (PNG/JPG). Se descarga <b>targets.mind</b>; ponelo junto a index.html.</p>
<input type="file" id="f" accept="image/*"><p id="s"></p>
<script>
document.getElementById('f').onchange = async e => {
  const s = document.getElementById('s');
  const img = new Image(); img.src = URL.createObjectURL(e.target.files[0]);
  await img.decode();
  const c = new window.MINDAR.IMAGE.Compiler();
  await c.compileImageTargets([img], p => s.textContent = 'Compilando… ' + p.toFixed(0) + '%');
  const buf = await c.exportData();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf])); a.download = 'targets.mind'; a.click();
  s.textContent = 'Listo: targets.mind descargado.';
};
</script></body></html>
